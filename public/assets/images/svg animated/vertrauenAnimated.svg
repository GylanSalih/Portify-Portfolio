<svg viewBox="0 0 700 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vertrauen Illustration" style="width:100%;max-width:700px;background:#0a0a0a;border-radius:20px;">
  <defs>
    <radialGradient id="bgGlowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowV" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowVheart" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!--
      Avatar design (inside left card):
      Avatar circle: cx=90 cy=168 r=16
      Head: cx=90 cy=162 r=6  (sits upper portion of circle)
      Shoulders/torso: a half-ellipse at the bottom of the circle
        — clip to avatar circle so body fill stays inside
      The body is drawn as a path that fills the lower arc of the avatar circle.
      clipPath "avatarClip" clips body to the circle shape.

      "Kunde" text: x=114 y=165 (vertically centered on avatar cy=168 → baseline~165)
      green dot: cx=110 cy=172 r=2.5
      "online" text: x=114 y=173
    -->
    <clipPath id="avatarClip">
      <circle cx="90" cy="168" r="16"/>
    </clipPath>

    <!-- Particle paths on connection lines -->
    <path id="msgOut1" d="M 202 210 L 318 210"/>
    <path id="msgIn1"  d="M 318 210 L 202 210"/>
    <path id="msgOut2" d="M 498 210 L 382 210"/>
    <path id="msgIn2"  d="M 382 210 L 498 210"/>

    <style>
      .grid-v { animation: gridFadeV 4s ease-in-out infinite; }
      @keyframes gridFadeV { 0%,100%{opacity:0.04} 50%{opacity:0.09} }

      .bubble-1 { animation: bubbleIn 7s ease-in-out infinite 0s; }
      .bubble-2 { animation: bubbleIn 7s ease-in-out infinite 0.8s; }
      .bubble-3 { animation: bubbleIn 7s ease-in-out infinite 1.6s; }
      @keyframes bubbleIn {
        0%,8%   { opacity:0; transform:translateY(4px); }
        18%,80% { opacity:1; transform:translateY(0); }
        92%,100%{ opacity:0.5; }
      }

      .avatar-ring { animation: avatarPulse 4s ease-in-out infinite; }
      @keyframes avatarPulse { 0%,100%{ stroke-opacity:0.22; } 50%{ stroke-opacity:0.55; } }

      .heart-hub { animation: heartBeat 1.8s ease-in-out infinite; transform-origin: 350px 210px; }
      @keyframes heartBeat {
        0%,100%{ transform:scale(1);    opacity:0.7; }
        14%    { transform:scale(1.15); opacity:1; }
        28%    { transform:scale(1);    opacity:0.7; }
        42%    { transform:scale(1.08); opacity:0.9; }
      }

      .node-v-l { animation: floatVL 5s ease-in-out infinite; }
      .node-v-r { animation: floatVR 5.3s ease-in-out infinite 0.7s; }
      @keyframes floatVL { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes floatVR { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

      .dot-t1 { animation: typeDot 1.4s ease-in-out infinite 0s; }
      .dot-t2 { animation: typeDot 1.4s ease-in-out infinite 0.2s; }
      .dot-t3 { animation: typeDot 1.4s ease-in-out infinite 0.4s; }
      @keyframes typeDot { 0%,60%,100%{opacity:0.2;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }

      /* ── TIMELINE (12s cycle) ── */
      .tl-line-fill { animation: tlFill 12s linear infinite; }
      @keyframes tlFill {
        0%   { height:0; }
        16%  { height:30px; }
        33%  { height:60px; }
        50%  { height:90px; }
        67%  { height:120px; }
        100% { height:120px; }
      }

      .tl-dot-1 { animation: tdot1 12s linear infinite; }
      .tl-dot-2 { animation: tdot2 12s linear infinite; }
      .tl-dot-3 { animation: tdot3 12s linear infinite; }
      .tl-dot-4 { animation: tdot4 12s linear infinite; }
      @keyframes tdot1 {
        0%,16%  { fill:rgba(255,255,255,0.9);  r:5; }
        25%     { fill:rgba(255,255,255,0.5);  r:4; }
        99%     { fill:rgba(255,255,255,0.5);  r:4; }
        100%    { fill:rgba(255,255,255,0.25); r:3.5; }
      }
      @keyframes tdot2 {
        0%,15%  { fill:rgba(255,255,255,0.2);  r:3.5; }
        16%,32% { fill:rgba(255,255,255,0.9);  r:5; }
        40%     { fill:rgba(255,255,255,0.5);  r:4; }
        100%    { fill:rgba(255,255,255,0.5);  r:4; }
      }
      @keyframes tdot3 {
        0%,32%  { fill:rgba(255,255,255,0.2);  r:3.5; }
        33%,49% { fill:rgba(255,255,255,0.9);  r:5; }
        57%     { fill:rgba(255,255,255,0.5);  r:4; }
        100%    { fill:rgba(255,255,255,0.5);  r:4; }
      }
      @keyframes tdot4 {
        0%,49%  { fill:rgba(255,255,255,0.2);  r:3.5; }
        50%,66% { fill:rgba(255,255,255,0.9);  r:5; }
        74%     { fill:rgba(255,255,255,0.5);  r:4; }
        100%    { fill:rgba(255,255,255,0.5);  r:4; }
      }

      .tl-check-1 { animation: tcheck1 12s linear infinite; }
      .tl-check-2 { animation: tcheck2 12s linear infinite; }
      .tl-check-3 { animation: tcheck3 12s linear infinite; }
      .tl-check-4 { animation: tcheck4 12s linear infinite; }
      @keyframes tcheck1 { 0%,8%{opacity:0} 14%,99%{opacity:1} 100%{opacity:0} }
      @keyframes tcheck2 { 0%,24%{opacity:0} 30%,99%{opacity:1} 100%{opacity:0} }
      @keyframes tcheck3 { 0%,40%{opacity:0} 46%,99%{opacity:1} 100%{opacity:0} }
      @keyframes tcheck4 { 0%,56%{opacity:0} 62%,99%{opacity:1} 100%{opacity:0} }

      .sat-bar { animation: satFill 12s linear infinite; }
      @keyframes satFill { 0%,65%{width:0} 83%,100%{width:96px} }

      .heart-pop-1 { animation: heartPop 12s ease-in-out infinite; }
      .heart-pop-2 { animation: heartPop 12s ease-in-out infinite 0.3s; }
      .heart-pop-3 { animation: heartPop 12s ease-in-out infinite 0.6s; }
      .heart-pop-4 { animation: heartPop 12s ease-in-out infinite 0.9s; }
      @keyframes heartPop {
        0%,74%  { opacity:0; transform:translateY(0) scale(0.3); }
        78%     { opacity:0.9; transform:translateY(-8px) scale(1); }
        85%     { opacity:0.7; transform:translateY(-14px) scale(0.9); }
        93%     { opacity:0; transform:translateY(-20px) scale(0.6); }
        100%    { opacity:0; }
      }
    </style>
  </defs>

  <ellipse cx="350" cy="225" rx="300" ry="200" fill="url(#bgGlowV)"/>
  <line class="grid-v" x1="175" y1="40"  x2="175" y2="420" stroke="white" stroke-width="0.5"/>
  <line class="grid-v" x1="525" y1="40"  x2="525" y2="420" stroke="white" stroke-width="0.5"/>
  <line class="grid-v" x1="80"  y1="225" x2="620" y2="225" stroke="white" stroke-width="0.5"/>

  <!-- Connection lines at y=210 -->
  <line x1="202" y1="210" x2="318" y2="210" stroke="white" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 4"/>
  <line x1="382" y1="210" x2="492" y2="210" stroke="white" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 4"/>

  <!-- Particles on lines -->
  <circle r="2.5" fill="white" filter="url(#glowV)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#msgOut1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="2.5" fill="white" filter="url(#glowV)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#msgIn1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle r="2.5" fill="white" filter="url(#glowV)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.5s"><mpath href="#msgOut2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="2.5" fill="white" filter="url(#glowV)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.6s"><mpath href="#msgIn2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.2s" repeatCount="indefinite" begin="1.6s"/>
  </circle>

  <!-- CENTER HUB — heart only, NO text -->
  <circle cx="350" cy="210" r="68" fill="#111" fill-opacity="0.5" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <g class="heart-hub">
    <path d="M 350 225 C 350 225 330 212 330 200 C 330 193 336 188 343 190 C 346 191 348 193 350 196 C 352 193 354 191 357 190 C 364 188 370 193 370 200 C 370 212 350 225 350 225 Z"
      fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- ── LEFT PANEL: Kunde / Chat ── -->
  <g class="node-v-l">
    <rect x="44" y="140" width="150" height="175" rx="14" fill="#111" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

    <!--
      AVATAR: circle cx=90 cy=168 r=16
      Head:   circle cx=90 cy=162 r=6  (top portion)
      Body/shoulders: fills lower half of avatar circle
        — drawn as an ellipse that fills from y=168 downward, clipped to avatar circle
        Ellipse cx=90 cy=178 rx=12 ry=9 → fills the lower shoulder area
      The whole thing is clipped to the avatar circle so it looks like a proper user icon.
    -->
    <!-- Avatar background circle -->
    <circle cx="90" cy="168" r="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="1" class="avatar-ring"/>
    <!-- Head -->
    <circle cx="90" cy="163" r="6" fill="rgba(255,255,255,0.45)" clip-path="url(#avatarClip)"/>
    <!-- Shoulders/torso — large ellipse clipped to avatar circle, sits at bottom -->
    <ellipse cx="90" cy="179" rx="13" ry="10" fill="rgba(255,255,255,0.32)" clip-path="url(#avatarClip)"/>

    <!--
      Name + status: vertically centered on avatar cy=168
      Avatar occupies y=152..184 (168±16)
      Midpoint for "Kunde" (font ~8px cap height): y = 168 - 3 = 165  → baseline 165
      "online" line below: y = 165 + 10 = 175
      Green dot to left of "online": cx=110 cy=172
    -->
    <text x="114" y="165" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.6)" font-weight="bold">Kunde</text>
    <!-- Green online dot -->
    <circle cx="112" cy="173" r="2.8" fill="#22c55e"/>
    <text x="118" y="176" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.3)">online</text>

    <!-- Chat bubbles -->
    <g class="bubble-1">
      <rect x="62" y="196" width="112" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
      <rect x="68" y="202" width="72" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
      <rect x="68" y="208" width="52" height="2.5" rx="1.2" fill="rgba(255,255,255,0.2)"/>
    </g>
    <g class="bubble-2">
      <rect x="62" y="220" width="90" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>
      <rect x="68" y="225" width="56" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
      <rect x="68" y="231" width="40" height="2.5" rx="1.2" fill="rgba(255,255,255,0.18)"/>
    </g>
    <g class="bubble-3">
      <rect x="62" y="242" width="112" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
      <rect x="68" y="247" width="84" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
      <rect x="68" y="253" width="58" height="2.5" rx="1.2" fill="rgba(255,255,255,0.2)"/>
    </g>
    <!-- Typing indicator -->
    <rect x="62" y="265" width="50" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>
    <circle class="dot-t1" cx="76"  cy="273" r="2.5" fill="rgba(255,255,255,0.5)"/>
    <circle class="dot-t2" cx="86"  cy="273" r="2.5" fill="rgba(255,255,255,0.5)"/>
    <circle class="dot-t3" cx="96"  cy="273" r="2.5" fill="rgba(255,255,255,0.5)"/>
    <text x="116" y="276" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.18)">schreibt...</text>
  </g>

  <!-- ── RIGHT PANEL: PROZESS Timeline ── -->
  <g class="node-v-r">
    <rect x="506" y="140" width="150" height="180" rx="14" fill="#111" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <text x="526" y="162" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)" letter-spacing="1">PROZESS</text>

    <!-- Timeline vertical track -->
    <rect x="521" y="175" width="1.5" height="120" rx="0.75" fill="rgba(255,255,255,0.08)"/>
    <rect x="521" y="175" width="1.5" height="0"   rx="0.75" fill="rgba(255,255,255,0.55)" class="tl-line-fill"/>

    <!-- Step 1: Erstgespräch -->
    <circle class="tl-dot-1" cx="522" cy="180" r="3.5" fill="rgba(255,255,255,0.9)"/>
    <text x="533" y="184" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.5)">Erstgespräch</text>
    <g class="tl-check-1" opacity="0">
      <circle cx="618" cy="180" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <polyline points="615,180 617,183 622,177" stroke="rgba(255,255,255,0.9)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Step 2: Konzept -->
    <circle class="tl-dot-2" cx="522" cy="210" r="3.5" fill="rgba(255,255,255,0.2)"/>
    <text x="533" y="214" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.38)">Konzept</text>
    <g class="tl-check-2" opacity="0">
      <circle cx="618" cy="210" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <polyline points="615,210 617,213 622,207" stroke="rgba(255,255,255,0.9)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Step 3: Umsetzung -->
    <circle class="tl-dot-3" cx="522" cy="240" r="3.5" fill="rgba(255,255,255,0.2)"/>
    <text x="533" y="244" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.28)">Umsetzung</text>
    <g class="tl-check-3" opacity="0">
      <circle cx="618" cy="240" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <polyline points="615,240 617,243 622,237" stroke="rgba(255,255,255,0.9)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Step 4: Launch -->
    <circle class="tl-dot-4" cx="522" cy="270" r="3.5" fill="rgba(255,255,255,0.2)"/>
    <text x="533" y="274" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.2)">Launch</text>
    <g class="tl-check-4" opacity="0">
      <circle cx="618" cy="270" r="5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <polyline points="615,270 617,273 622,267" stroke="rgba(255,255,255,0.9)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Zufriedenheit -->
    <text x="526" y="294" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.2)">Zufriedenheit</text>
    <rect x="526" y="298" width="96" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
    <rect x="526" y="298" width="0"  height="6" rx="3" fill="rgba(255,255,255,0.55)" class="sat-bar"/>
  </g>

  <!-- Floating hearts near satisfaction bar -->
  <g class="heart-pop-1" style="transform-origin:560px 295px">
    <path d="M 560 299 C 560 299 552 294 552 289 C 552 286 554.5 284 557 285 C 558 285.5 559 286.5 560 288 C 561 286.5 562 285.5 563 285 C 565.5 284 568 286 568 289 C 568 294 560 299 560 299Z"
      fill="rgba(255,255,255,0.7)" filter="url(#glowVheart)"/>
  </g>
  <g class="heart-pop-2" style="transform-origin:575px 292px">
    <path d="M 575 296 C 575 296 569 291 569 287 C 569 284.5 571 282.5 573 283.5 C 574 284 574.8 285 575 286.3 C 575.2 285 576 284 577 283.5 C 579 282.5 581 284.5 581 287 C 581 291 575 296 575 296Z"
      fill="rgba(255,255,255,0.55)" filter="url(#glowVheart)"/>
  </g>
  <g class="heart-pop-3" style="transform-origin:548px 290px">
    <path d="M 548 293 C 548 293 543 289 543 286 C 543 284 544.8 282.5 546.5 283.2 C 547 283.5 547.6 284.3 548 285.3 C 548.4 284.3 549 283.5 549.5 283.2 C 551.2 282.5 553 284 553 286 C 553 289 548 293 548 293Z"
      fill="rgba(255,255,255,0.5)" filter="url(#glowVheart)"/>
  </g>
  <g class="heart-pop-4" style="transform-origin:588px 296px">
    <path d="M 588 299 C 588 299 583 295 583 291 C 583 289 584.6 287.2 586.5 288 C 587 288.3 587.5 289 588 290 C 588.5 289 589 288.3 589.5 288 C 591.4 287.2 593 289 593 291 C 593 295 588 299 588 299Z"
      fill="rgba(255,255,255,0.45)" filter="url(#glowVheart)"/>
  </g>

</svg>
