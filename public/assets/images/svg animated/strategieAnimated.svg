<svg viewBox="0 0 700 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strategie Illustration" style="width:100%;max-width:700px;background:#0a0a0a;border-radius:20px;">
  <defs>
    <radialGradient id="bgGlowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!--
      COORDINATE PLAN (all verified):
      ROOT HOME:     x=308 y=118 w=84 h=37  cx=350  bottom=155
      L1 LEISTUNGEN: x=160 y=228 w=84 h=35  cx=202  top=228  bottom=263
      C1 PORTFOLIO:  x=308 y=228 w=84 h=35  cx=350  top=228  bottom=263
      R1 KONTAKT:    x=456 y=228 w=84 h=35  cx=498  top=228  bottom=263

      6 L2 nodes w=60 h=26 gap=14  startX=135  (6×60+5×14=430, (700-430)/2=135)
      WEBDESIGN:  x=135 cx=165 top=318
      SEO:        x=209 cx=239 top=318
      PROJEKTE:   x=283 cx=313 top=318
      CASE STUDY: x=357 cx=387 top=318
      FORMULAR:   x=431 cx=461 top=318
      SOCIAL:     x=505 cx=535 top=318

      Parent-child center alignment:
      LEISTUNGEN cx=202 = (165+239)/2=202 ✓
      PORTFOLIO  cx=350 = (313+387)/2=350 ✓
      KONTAKT    cx=498 = (461+535)/2=498 ✓
    -->
    <path id="pRL1"   d="M 350 155 L 202 228"/>
    <path id="pRC1"   d="M 350 155 L 350 228"/>
    <path id="pRR1"   d="M 350 155 L 498 228"/>
    <path id="pL1WD"  d="M 202 263 L 165 318"/>
    <path id="pL1SEO" d="M 202 263 L 239 318"/>
    <path id="pC1PRJ" d="M 350 263 L 313 318"/>
    <path id="pC1CS"  d="M 350 263 L 387 318"/>
    <path id="pR1FM"  d="M 498 263 L 461 318"/>
    <path id="pR1SC"  d="M 498 263 L 535 318"/>
    <style>
      .grid-s { animation: gridFadeS 4s ease-in-out infinite; }
      @keyframes gridFadeS { 0%,100%{opacity:0.04} 50%{opacity:0.09} }
      .node-root { animation: floatRoot 4s ease-in-out infinite; }
      @keyframes floatRoot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      .node-l1 { animation: floatL1 5s ease-in-out infinite 0.3s; }
      .node-c1 { animation: floatC1 4.5s ease-in-out infinite 0.8s; }
      .node-r1 { animation: floatR1 5.2s ease-in-out infinite 0.5s; }
      @keyframes floatL1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      @keyframes floatC1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes floatR1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      .node-l2 { animation: floatL2 4.8s ease-in-out infinite 1s; }
      .node-c2 { animation: floatC2 5s ease-in-out infinite 0.2s; }
      .node-r2 { animation: floatR2 4.6s ease-in-out infinite 0.7s; }
      @keyframes floatL2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      @keyframes floatC2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      @keyframes floatR2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      .active-cycle-0 { animation: activePop 9s ease-in-out infinite 0s; }
      .active-cycle-1 { animation: activePop 9s ease-in-out infinite 3s; }
      .active-cycle-2 { animation: activePop 9s ease-in-out infinite 6s; }
      @keyframes activePop {
        0%,10%  { stroke-opacity:0.55; fill-opacity:0.12; }
        20%,80% { stroke-opacity:0.12; fill-opacity:0.04; }
        90%,100%{ stroke-opacity:0.55; fill-opacity:0.12; }
      }
    </style>
  </defs>

