    <text x="313" y="328" font-family="monospace" font-size="5.2" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="0.4">PROJEKTE</text>
    <rect x="291" y="333" width="44" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="296" y="337" width="32" height="1.8" rx="0.9" fill="rgba(255,255,255,0.12)"/>
  </g>
  <g class="node-c2">
    <rect x="357" y="318" width="60" height="26" rx="6" fill="#111" stroke="rgba(255,255,255,0.09)" stroke-width="0.8"/>
    <text x="387" y="328" font-family="monospace" font-size="5.2" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="0.4">CASE STUDY</text>
    <rect x="365" y="333" width="44" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="370" y="337" width="32" height="1.8" rx="0.9" fill="rgba(255,255,255,0.12)"/>
  </g>
  <g class="node-r2">
