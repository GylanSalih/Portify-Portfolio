    <rect x="456" y="228" width="84" height="35" rx="9" fill="rgba(255,255,255,0.04)"/>
    <text x="498" y="241" font-family="monospace" font-size="5.8" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="0.6">KONTAKT</text>
    <rect x="466" y="247" width="64" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
    <rect x="472" y="253" width="50" height="2.5" rx="1.2" fill="rgba(255,255,255,0.18)"/>
  </g>

