  </circle>
  <circle r="2.5" fill="white" filter="url(#glowS)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#pRR1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.0s"><mpath href="#pL1WD"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="2.0s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.6s"><mpath href="#pL1SEO"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="2.6s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.2s"><mpath href="#pC1PRJ"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="2.2s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.9s"><mpath href="#pC1CS"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="2.9s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.4s"><mpath href="#pR1FM"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="2.4s"/>
  </circle>
  <circle r="1.8" fill="white" filter="url(#glowS)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="3.1s"><mpath href="#pR1SC"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="1.8s" repeatCount="indefinite" begin="3.1s"/>
  </circle>

  <!-- ROOT HOME -->
  <g class="node-root">
    <rect x="308" y="118" width="84" height="37" rx="10" fill="#111" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" class="active-cycle-0"/>
    <rect x="308" y="118" width="84" height="37" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="350" y="132" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="0.8">HOME</text>
