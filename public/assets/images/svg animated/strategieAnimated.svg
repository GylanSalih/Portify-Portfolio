  <line class="grid-s" x1="175" y1="40"  x2="175" y2="410" stroke="white" stroke-width="0.5"/>
  <line class="grid-s" x1="525" y1="40"  x2="525" y2="410" stroke="white" stroke-width="0.5"/>
  <line class="grid-s" x1="80"  y1="225" x2="620" y2="225" stroke="white" stroke-width="0.5"/>

  <!-- Connection lines drawn before nodes -->
  <line x1="350" y1="155" x2="202" y2="228" stroke="white" stroke-width="1"   stroke-opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="350" y1="155" x2="350" y2="228" stroke="white" stroke-width="1"   stroke-opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="350" y1="155" x2="498" y2="228" stroke="white" stroke-width="1"   stroke-opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="202" y1="263" x2="165" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>
  <line x1="202" y1="263" x2="239" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>
  <line x1="350" y1="263" x2="313" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>
  <line x1="350" y1="263" x2="387" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>
  <line x1="498" y1="263" x2="461" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>
  <line x1="498" y1="263" x2="535" y2="318" stroke="white" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="3 4"/>

  <!-- Particles along every branch -->
  <circle r="2.5" fill="white" filter="url(#glowS)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#pRL1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="2.4s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="2.5" fill="white" filter="url(#glowS)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#pRC1"/></animateMotion>
