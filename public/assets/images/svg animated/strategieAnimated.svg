    <text x="239" y="328" font-family="monospace" font-size="5.2" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="0.4">SEO</text>
    <rect x="217" y="333" width="44" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="222" y="337" width="32" height="1.8" rx="0.9" fill="rgba(255,255,255,0.12)"/>
